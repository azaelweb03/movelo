name: Repair MOVELO JavaScript
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair literal newline escape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app.js")
          s = p.read_text()
          fixed = s.replace("\\\\n", "\n")
          if fixed != s:
              p.write_text(fixed)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix homepage JavaScript syntax error"
          git push
