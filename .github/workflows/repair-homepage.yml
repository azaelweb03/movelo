name: Repair MOVELO homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app.js")
          s=p.read_text()
          fixed=s.replace(chr(92)+"n", chr(10))
          if fixed != s:
              p.write_text(fixed)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix MOVELO homepage JavaScript"
          git push
